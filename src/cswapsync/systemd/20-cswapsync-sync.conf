# Drop-in for the EXISTING cswap-refresh.service, installed at
# ~/.config/systemd/user/cswap-refresh.service.d/20-cswapsync-sync.conf
# One service: refresh script (+ its notifications) runs first, then, in the
# same unit, CSwapSync verifies the refresh + account health and pushes the
# encrypted backup to Drive, with its own success/failure notification.
# The original cswap-refresh.service file is not edited. Delete this file to undo.
[Service]
UMask=0077
ExecStartPost=@CSWAPSYNC_BIN@ post-refresh --inline --notify
