# OPTIONAL drop-in (installed only by `setup.sh --gate-refresh`) at
# ~/.config/systemd/user/cswap-refresh.service.d/. Skips the existing refresh
# while another device holds the session lease: refreshing here would rotate
# refresh tokens out from under that device. Remove the file to undo.
[Service]
ExecCondition=%h/CSwapSync/scripts/cswapsync lease-check
